apiVersion: apps/v1
kind: Deployment
metadata:
  name: meshnet-mobile-backend
  namespace: meshnet
  labels:
    app: meshnet-mobile-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: meshnet-mobile-backend
  template:
    metadata:
      labels:
        app: meshnet-mobile-backend
    spec:
      containers:
      - name: mobile-backend
        image: ghcr.io/yourusername/meshnet-mobile:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: API_GATEWAY_URL
          value: "http://meshnet-api-gateway:5000"
        - name: WS_URL
          value: "ws://meshnet-ultra:80/websocket"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: meshnet-secrets
              key: jwt-secret
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: meshnet-mobile-backend
  namespace: meshnet
  labels:
    app: meshnet-mobile-backend
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: 3000
    name: http
  selector:
    app: meshnet-mobile-backend
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: meshnet-mobile-ingress
  namespace: meshnet
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
  - hosts:
    - api.meshnet.yourdomain.com
    secretName: meshnet-api-tls
  rules:
  - host: api.meshnet.yourdomain.com
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: meshnet-api-gateway
            port:
              number: 5000
      - path: /mobile
        pathType: Prefix
        backend:
          service:
            name: meshnet-mobile-backend
            port:
              number: 3000
