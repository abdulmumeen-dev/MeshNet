apiVersion: apps/v1
kind: Deployment
metadata:
  name: meshnet-ml-serving
  namespace: meshnet
  labels:
    app: meshnet-ml-serving
spec:
  replicas: 1
  selector:
    matchLabels:
      app: meshnet-ml-serving
  template:
    metadata:
      labels:
        app: meshnet-ml-serving
    spec:
      containers:
      - name: ml-serving
        image: ghcr.io/yourusername/meshnet-ml:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
        - containerPort: 8001
          name: grpc
        env:
        - name: MODEL_PATH
          value: "/models/meshnet_model.pkl"
        - name: MODEL_VERSION
          value: "v2.3.1"
        - name: LOG_LEVEL
          value: "info"
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
        volumeMounts:
        - name: model-storage
          mountPath: /models
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
      volumes:
      - name: model-storage
        persistentVolumeClaim:
          claimName: ml-models-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: meshnet-ml-serving
  namespace: meshnet
  labels:
    app: meshnet-ml-serving
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    name: http
  - port: 8001
    targetPort: 8001
    name: grpc
  selector:
    app: meshnet-ml-serving
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: meshnet-ml-serving-hpa
  namespace: meshnet
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: meshnet-ml-serving
  minReplicas: 1
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 80
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
