version: '3.8'

services:
  meshnet-node:
    build: .
    container_name: meshnet-ultra
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config
    environment:
      - NODE_ID=${NODE_ID}
      - NODE_ROLE=${NODE_ROLE:-auto}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - ENABLE_QUANTUM=${ENABLE_QUANTUM:-true}
      - ENABLE_AI=${ENABLE_AI:-true}
      - ENABLE_BLOCKCHAIN=${ENABLE_BLOCKCHAIN:-true}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8080), timeout=2)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  meshnet-web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: meshnet-web
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "3000:3000"
    volumes:
      - ./web:/app/web
      - ./data:/app/data
    environment:
      - API_URL=http://meshnet-node:8080
    depends_on:
      - meshnet-node
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  meshnet-prometheus:
    image: prom/prometheus:latest
    container_name: meshnet-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  meshnet-grafana:
    image: grafana/grafana:latest
    container_name: meshnet-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - ./grafana_data:/var/lib/grafana
      - ./grafana_dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana_datasources:/etc/grafana/provisioning/datasources
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    depends_on:
      - meshnet-prometheus
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  meshnet-nginx:
    image: nginx:alpine
    container_name: meshnet-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
      - ./web/static:/usr/share/nginx/html/static
    depends_on:
      - meshnet-web
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  meshnet:
    driver: bridge
