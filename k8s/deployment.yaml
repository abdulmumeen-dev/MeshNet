apiVersion: apps/v1
kind: Deployment
metadata:
  name: meshnet-ultra
  namespace: meshnet
  labels:
    app: meshnet-ultra
    version: v2.0.0
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: meshnet-ultra
  template:
    metadata:
      labels:
        app: meshnet-ultra
        version: v2.0.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: meshnet-node
        image: ghcr.io/yourusername/meshnet-ultra:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 9876
          name: discovery
        - containerPort: 9877
          name: comm
        - containerPort: 9878
          name: gateway
        env:
        - name: NODE_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: NODE_ROLE
          value: "auto"
        - name: LOG_LEVEL
          value: "info"
        - name: ENABLE_QUANTUM
          value: "true"
        - name: ENABLE_AI
          value: "true"
        - name: ENABLE_BLOCKCHAIN
          value: "true"
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        volumeMounts:
        - name: meshnet-data
          mountPath: /app/data
        - name: meshnet-logs
          mountPath: /app/logs
        - name: meshnet-config
          mountPath: /app/config
      volumes:
      - name: meshnet-data
        persistentVolumeClaim:
          claimName: meshnet-data-pvc
      - name: meshnet-logs
        persistentVolumeClaim:
          claimName: meshnet-logs-pvc
      - name: meshnet-config
        configMap:
          name: meshnet-config
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: meshnet-ultra
  namespace: meshnet
  labels:
    app: meshnet-ultra
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: 8080
  - name: discovery
    port: 9876
    targetPort: 9876
  - name: comm
    port: 9877
    targetPort: 9877
  - name: gateway
    port: 9878
    targetPort: 9878
  selector:
    app: meshnet-ultra
---
apiVersion: v1
kind: Service
metadata:
  name: meshnet-ultra-headless
  namespace: meshnet
  labels:
    app: meshnet-ultra
spec:
  clusterIP: None
  ports:
  - name: discovery
    port: 9876
  - name: comm
    port: 9877
  - name: gateway
    port: 9878
  selector:
    app: meshnet-ultra
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: meshnet-ultra-hpa
  namespace: meshnet
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: meshnet-ultra
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: meshnet-ultra-pdb
  namespace: meshnet
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: meshnet-ultra
