apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: meshnet
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    alerting:
      alertmanagers:
      - static_configs:
        - targets: ['alertmanager:9093']
    rule_files:
    - "/etc/prometheus/alerts/*.yml"
    scrape_configs:
    - job_name: 'kubernetes-pods'
      kubernetes_sd_configs:
      - role: pod
      relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: true
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      - action: labelmap
        regex: __meta_kubernetes_pod_label_(.+)
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-alerts
  namespace: meshnet
data:
  meshnet-alerts.yml: |
    groups:
    - name: meshnet-alerts
      rules:
      - alert: MeshNetNodeDown
        expr: up{job="kubernetes-pods"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "MeshNet node {{ $labels.pod }} is down"
          description: "{{ $labels.pod }} has been down for more than 1 minute"
      - alert: HighLatency
        expr: meshnet_latency_seconds > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High latency detected"
          description: "Latency is above 5 seconds for {{ $labels.pod }}"
      - alert: LowBandwidth
        expr: meshnet_bandwidth_mbps < 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Low bandwidth detected"
          description: "Bandwidth is below 1 Mbps for {{ $labels.pod }}"
