apiVersion: apps/v1
kind: Deployment
metadata:
  name: meshnet-api-gateway
  namespace: meshnet
  labels:
    app: meshnet-api-gateway
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: meshnet-api-gateway
  template:
    metadata:
      labels:
        app: meshnet-api-gateway
        version: v1
    spec:
      containers:
      - name: api-gateway
        image: ghcr.io/yourusername/meshnet-api:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
          name: http
        env:
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: meshnet-secrets
              key: jwt-secret
        - name: REDIS_HOST
          value: "redis-service"
        - name: REDIS_PORT
          value: "6379"
        - name: LOG_LEVEL
          value: "info"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: meshnet-api-gateway
  namespace: meshnet
  labels:
    app: meshnet-api-gateway
spec:
  type: ClusterIP
  ports:
  - port: 5000
    targetPort: 5000
    name: http
  selector:
    app: meshnet-api-gateway
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: meshnet-api-gateway-hpa
  namespace: meshnet
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: meshnet-api-gateway
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
