<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeshNet Ultra Dashboard</title>
    <script src="https://cdn.socket.io/4.5.0/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #0a0a0f;
            color: #e0e0e0;
            min-height: 100vh;
        }
        .header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            padding: 20px;
            border-bottom: 1px solid #2a2a4a;
        }
        .header h1 {
            font-size: 28px;
            background: linear-gradient(90deg, #00d4ff, #7b2ffc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header .subtitle {
            color: #8888aa;
            font-size: 14px;
            margin-top: 5px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: #14141e;
            border: 1px solid #2a2a4a;
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s;
        }
        .stat-card:hover {
            border-color: #4a4a7a;
            transform: translateY(-2px);
        }
        .stat-card .label {
            color: #8888aa;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .stat-card .value {
            font-size: 28px;
            font-weight: bold;
            margin-top: 10px;
            background: linear-gradient(90deg, #00d4ff, #7b2ffc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .panel {
            background: #14141e;
            border: 1px solid #2a2a4a;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .panel h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #aaaacc;
        }
        .node-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px;
        }
        .node-item {
            background: #1a1a2e;
            border: 1px solid #2a2a4a;
            border-radius: 8px;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .node-item .id {
            font-family: monospace;
            color: #7b2ffc;
        }
        .node-item .status {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
        }
        .status.online {
            background: #00d4ff33;
            color: #00d4ff;
            border: 1px solid #00d4ff44;
        }
        .status.offline {
            background: #ff444433;
            color: #ff4444;
            border: 1px solid #ff444444;
        }
        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
        }
        .btn-primary {
            background: linear-gradient(90deg, #00d4ff, #7b2ffc);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(123, 47, 252, 0.3);
        }
        .btn-secondary {
            background: #2a2a4a;
            color: #aaaacc;
        }
        .btn-secondary:hover {
            background: #3a3a5a;
        }
        .btn-danger {
            background: #ff4444;
            color: white;
        }
        .btn-danger:hover {
            background: #ff6666;
        }
        .chart-container {
            height: 300px;
            margin-top: 20px;
        }
        .log {
            background: #0a0a12;
            border: 1px solid #1a1a2e;
            border-radius: 8px;
            padding: 15px;
            max-height: 200px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
        }
        .log .entry {
            padding: 4px 0;
            border-bottom: 1px solid #1a1a2e;
        }
        .log .entry .time {
            color: #666688;
            margin-right: 10px;
        }
        .log .entry .level-info {
            color: #00d4ff;
        }
        .log .entry .level-warning {
            color: #ffaa00;
        }
        .log .entry .level-error {
            color: #ff4444;
        }
        @media (max-width: 768px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .node-list {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="container">
            <h1>🌐 MeshNet Ultra</h1>
            <div class="subtitle">Live Network Dashboard • v2.0.0</div>
        </div>
    </div>

    <div class="container">
        <!-- Stats -->
        <div class="stats-grid" id="statsGrid">
            <div class="stat-card">
                <div class="label">Total Nodes</div>
                <div class="value" id="totalNodes">0</div>
            </div>
            <div class="stat-card">
                <div class="label">Active Gateways</div>
                <div class="value" id="activeGateways">0</div>
            </div>
            <div class="stat-card">
                <div class="label">Total Bandwidth</div>
                <div class="value" id="totalBandwidth">0 Mbps</div>
            </div>
            <div class="stat-card">
                <div class="label">Network Health</div>
                <div class="value" id="networkHealth">100%</div>
            </div>
        </div>

        <!-- Controls -->
        <div class="panel">
            <h2>🎮 Network Controls</h2>
            <div class="controls">
                <button class="btn btn-primary" onclick="controlAction('discover')">🔍 Discover Nodes</button>
                <button class="btn btn-primary" onclick="controlAction('gateway')">🌍 Start Gateway</button>
                <button class="btn btn-secondary" onclick="controlAction('status')">📊 Refresh Status</button>
                <button class="btn btn-danger" onclick="controlAction('reset')">🔄 Reset Network</button>
            </div>
        </div>

        <!-- Nodes -->
        <div class="panel">
            <h2>🔗 Active Nodes</h2>
            <div class="node-list" id="nodeList">
                <div style="color: #666688; text-align: center; padding: 40px;">
                    No nodes connected yet. Click "Discover Nodes" to scan.
                </div>
            </div>
        </div>

        <!-- Charts -->
        <div class="panel">
            <h2>📈 Network Traffic</h2>
            <div class="chart-container">
                <canvas id="trafficChart"></canvas>
            </div>
        </div>

        <!-- Log -->
        <div class="panel">
            <h2>📝 Activity Log</h2>
            <div class="log" id="logContainer">
                <div class="entry">
                    <span class="time">[System]</span>
                    <span class="level-info">MeshNet Ultra dashboard initialized</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        let socket = null;
        let trafficChart = null;
        let logEntries = [];

        // Initialize
        function init() {
            // Socket connection
            socket = io.connect('http://' + window.location.hostname + ':3000');
            
            socket.on('connect', function() {
                addLog('info', 'Connected to MeshNet server');
            });

            socket.on('state_update', function(data) {
                updateStats(data.state);
                updateNodes(data.state.nodes);
            });

            socket.on('update', function(data) {
                updateStats(data.state);
                updateNodes(data.state.nodes);
                addLog('info', 'Network state updated');
            });

            socket.on('control', function(data) {
                addLog('info', 'Control: ' + data.action);
            });

            // Chart
            const ctx = document.getElementById('trafficChart').getContext('2d');
            trafficChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: 'Bandwidth (Mbps)',
                        data: [],
                        borderColor: '#7b2ffc',
                        backgroundColor: 'rgba(123, 47, 252, 0.1)',
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            labels: { color: '#aaaacc' }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            grid: { color: '#1a1a2e' },
                            ticks: { color: '#666688' }
                        },
                        x: {
                            grid: { color: '#1a1a2e' },
                            ticks: { color: '#666688' }
                        }
                    }
                }
            });

            // Auto-refresh
            setInterval(refreshStatus, 10000);
            refreshStatus();
        }

        function updateStats(stats) {
            if (!stats) return;
            document.getElementById('totalNodes').textContent = stats.total_nodes || 0;
            document.getElementById('activeGateways').textContent = stats.active_gateways || 0;
            document.getElementById('totalBandwidth').textContent = (stats.total_bandwidth || 0).toFixed(1) + ' Mbps';
            
            const health = stats.network_health || 100;
            document.getElementById('networkHealth').textContent = health + '%';
        }

        function updateNodes(nodes) {
            const container = document.getElementById('nodeList');
            if (!nodes || Object.keys(nodes).length === 0) {
                container.innerHTML = `
                    <div style="color: #666688; text-align: center; padding: 40px;">
                        No nodes connected yet. Click "Discover Nodes" to scan.
                    </div>
                `;
                return;
            }

            let html = '';
            for (const [id, node] of Object.entries(nodes)) {
                const status = node.online ? 'online' : 'offline';
                html += `
                    <div class="node-item">
                        <div>
                            <div class="id">${id.slice(0, 8)}</div>
                            <div style="font-size: 12px; color: #666688; margin-top: 4px;">
                                ${node.ip || 'Unknown IP'}
                            </div>
                        </div>
                        <div>
                            <span class="status ${status}">${node.online ? '🟢 Online' : '🔴 Offline'}</span>
                            ${node.is_gateway ? ' 🌍 Gateway' : ''}
                        </div>
                    </div>
                `;
            }
            container.innerHTML = html;
        }

        function controlAction(action) {
            if (!socket) return;
            
            let data = { action: action };
            if (action === 'connect') {
                const ip = prompt('Enter gateway IP address:');
                if (!ip) return;
                data.ip = ip;
            }
            
            fetch('/api/control', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(data => {
                addLog('info', 'Control action: ' + action + ' - ' + data.status);
            })
            .catch(error => {
                addLog('error', 'Control failed: ' + error);
            });
        }

        function refreshStatus() {
            fetch('/api/status')
                .then(response => response.json())
                .then(data => {
                    updateStats(data.state.stats);
                    updateNodes(data.state.nodes);
                })
                .catch(error => {
                    console.error('Status refresh failed:', error);
                });
        }

        function addLog(level, message) {
            const container = document.getElementById('logContainer');
            const time = new Date().toLocaleTimeString();
            const entry = document.createElement('div');
            entry.className = 'entry';
            entry.innerHTML = `
                <span class="time">[${time}]</span>
                <span class="level-${level}">${message}</span>
            `;
            container.appendChild(entry);
            container.scrollTop = container.scrollHeight;
            
            // Keep only last 50 entries
            while (container.children.length > 50) {
                container.removeChild(container.firstChild);
            }
        }

        // Simulate traffic data
        function addTrafficData() {
            if (!trafficChart) return;
            
            const now = new Date().toLocaleTimeString();
            const value = Math.random() * 100 + 20;
            
            trafficChart.data.labels.push(now);
            trafficChart.data.datasets[0].data.push(value);
            
            if (trafficChart.data.labels.length > 20) {
                trafficChart.data.labels.shift();
                trafficChart.data.datasets[0].data.shift();
            }
            
            trafficChart.update();
        }

        // Add traffic every 2 seconds
        setInterval(addTrafficData, 2000);

        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
